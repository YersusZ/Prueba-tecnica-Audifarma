apiVersion: apps/v1
kind: Deployment
metadata:
  name: audifarma
  labels:
    app: audifarma
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audifarma
  template:
    metadata:
      labels:
        app: audifarma
    spec:
      containers:
        - name: audifarma
          image: audifarma:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: default
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
